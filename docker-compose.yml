services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnhouse
      POSTGRES_PASSWORD: learnhouse
      POSTGRES_DB: learnhouse
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Full data snapshot (courses, 2506 problems, students, progress).
      # Runs only on first boot (empty volume); delete the `pgdata` volume to re-seed.
      - ./db/zk-dump.sql:/docker-entrypoint-initdb.d/01-zk-dump.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhouse -d learnhouse"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: apps/api
    restart: unless-stopped
    environment: &api-env
      LEARNHOUSE_SQL_CONNECTION_STRING: postgresql://learnhouse:learnhouse@postgres:5432/learnhouse
      LEARNHOUSE_REDIS_CONNECTION_STRING: redis://redis:6379/learnhouse
      LEARNHOUSE_AUTH_JWT_SECRET_KEY: ${LEARNHOUSE_AUTH_JWT_SECRET_KEY:-dev-secret-key-please-change-32chars!!}
      LEARNHOUSE_DEVELOPMENT_MODE: "true"
      LEARNHOUSE_DOMAIN: localhost:3000
      LEARNHOUSE_FRONTEND_DOMAIN: localhost:3000
      LEARNHOUSE_SITE_NAME: ZeroKnowledge
      LEARNHOUSE_TENANCY: single
      LEARNHOUSE_PORT: "9000"
      LEARNHOUSE_INITIAL_ADMIN_EMAIL: ${LEARNHOUSE_INITIAL_ADMIN_EMAIL:-admin@school.dev}
      LEARNHOUSE_INITIAL_ADMIN_PASSWORD: ${LEARNHOUSE_INITIAL_ADMIN_PASSWORD:-admin12345}
      LEARNHOUSE_INITIAL_ORG_NAME: ZeroKnowledge Academy
      LEARNHOUSE_INITIAL_ORG_SLUG: default
      LEARNHOUSE_JUDGE0_API_URL: http://runner:2358
      # Optional AI provider. Put the key in .env (gitignored) and restart api;
      # see docs/content/self-hosting/configuration/ai-setup.mdx.
      LEARNHOUSE_IS_AI_ENABLED: ${LEARNHOUSE_IS_AI_ENABLED:-false}
      LEARNHOUSE_AI_PROVIDER: ${LEARNHOUSE_AI_PROVIDER:-google}
      LEARNHOUSE_AI_API_KEY: ${LEARNHOUSE_AI_API_KEY:-}
      LEARNHOUSE_GEMINI_API_KEY: ${LEARNHOUSE_GEMINI_API_KEY:-}
      LEARNHOUSE_AI_BASE_URL: ${LEARNHOUSE_AI_BASE_URL:-}
      LEARNHOUSE_AI_MODEL_FAST: ${LEARNHOUSE_AI_MODEL_FAST:-}
      LEARNHOUSE_AI_MODEL_STANDARD: ${LEARNHOUSE_AI_MODEL_STANDARD:-}
      LEARNHOUSE_AI_MODEL_PRO: ${LEARNHOUSE_AI_MODEL_PRO:-}
      # Vision-capable model on the same gateway, used to describe uploaded
      # diagrams/images before the text-only planner sees them.
      LEARNHOUSE_AI_VISION_MODEL: ${LEARNHOUSE_AI_VISION_MODEL:-qwen3.8}
      LEARNHOUSE_AI_EMBEDDING_PROVIDER: ${LEARNHOUSE_AI_EMBEDDING_PROVIDER:-}
      LEARNHOUSE_AI_EMBEDDING_MODEL: ${LEARNHOUSE_AI_EMBEDDING_MODEL:-}
      # 0 disables periodic RAG indexing (useful when the chat provider has no
      # embeddings API, as embeddings would fail on every sweep).
      LEARNHOUSE_RAG_BACKFILL_HOURS: ${LEARNHOUSE_RAG_BACKFILL_HOURS:-48}
      # Set 0 when the chat provider has no embeddings API: skips event-driven
      # RAG indexing as well as the periodic backfill.
      LEARNHOUSE_RAG_ENABLED: ${LEARNHOUSE_RAG_ENABLED:-true}
      # Email delivery + verification. Secrets come from the environment, never
      # from the repo. Set these in your deployment's .env file.
      LEARNHOUSE_EMAIL_PROVIDER: ${LEARNHOUSE_EMAIL_PROVIDER:-resend}
      LEARNHOUSE_SYSTEM_EMAIL_ADDRESS: ${LEARNHOUSE_SYSTEM_EMAIL_ADDRESS:-}
      LEARNHOUSE_SYSTEM_EMAIL_SENDER_NAME: ${LEARNHOUSE_SYSTEM_EMAIL_SENDER_NAME:-ZeroKnowledge}
      LEARNHOUSE_RESEND_API_KEY: ${LEARNHOUSE_RESEND_API_KEY:-}
      LEARNHOUSE_SMTP_HOST: ${LEARNHOUSE_SMTP_HOST:-}
      LEARNHOUSE_SMTP_PORT: ${LEARNHOUSE_SMTP_PORT:-587}
      LEARNHOUSE_SMTP_USERNAME: ${LEARNHOUSE_SMTP_USERNAME:-}
      LEARNHOUSE_SMTP_PASSWORD: ${LEARNHOUSE_SMTP_PASSWORD:-}
      LEARNHOUSE_SMTP_USE_TLS: ${LEARNHOUSE_SMTP_USE_TLS:-true}
      # Base URL of emailed verification/login links for org-less (apex) signups.
      LEARNHOUSE_PLATFORM_URL: ${LEARNHOUSE_PLATFORM_URL:-}
      # Require email confirmation before login. Production-safe default is true.
      LEARNHOUSE_REQUIRE_EMAIL_VERIFICATION: ${LEARNHOUSE_REQUIRE_EMAIL_VERIFICATION:-true}
    volumes:
      # Course media (book PDFs, thumbnails, logos) served by the API.
      - ./apps/api/content:/app/content
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Self-hosted code judge: runs student code in isolated Docker containers.
  # Needs the host's Docker daemon (mounted socket) to spawn sandboxes.
  runner:
    build:
      context: apps/api
      dockerfile: Dockerfile.runner
    restart: unless-stopped
    environment:
      <<: *api-env
      LEARNHOUSE_JUDGE0_API_URL: http://runner:2358
      # The sandbox containers are siblings created via the host daemon, so
      # submission files must live on a volume both this container and the
      # daemon can see (a container-local path is invisible to the daemon).
      RUNNER_WORK_ROOT: /workspace
      RUNNER_WORK_VOLUME: zk-runner-work
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runnerwork:/workspace
    ports:
      - "2358:2358"

  web:
    build:
      context: apps/web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_LEARNHOUSE_API_URL: http://localhost:9000/api/v1/
      NEXT_PUBLIC_LEARNHOUSE_BACKEND_URL: http://localhost:9000
      # Server-side fetches (SSR, route handlers, middleware) run inside this
      # container, where "localhost" is not the API. These are not exposed to
      # the browser.
      LEARNHOUSE_INTERNAL_API_URL: http://api:9000/api/v1/
      LEARNHOUSE_INTERNAL_BACKEND_URL: http://api:9000
      NEXT_PUBLIC_LEARNHOUSE_DOMAIN: localhost:3000
      NEXT_PUBLIC_LEARNHOUSE_HTTPS: "false"
      NEXT_PUBLIC_LEARNHOUSE_DEFAULT_ORG: default
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  # Explicit name so the runner passes the same volume to sandbox containers
  # regardless of the Compose project name.
  runnerwork:
    name: zk-runner-work
